[package]
name = "vcp-mobile"
version = "1.1.6"
description = "A Tauri App"
authors = ["MRiecy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [".", "plugins/vcp-mobile"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
log = { version = "0.4", features = ["release_max_level_info"] }
jni = "0.21"
tauri = { version = "2.11.5" }

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vcp_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[package.metadata.android.build_targets]
targets = ["aarch64-linux-android"]

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net"] }
futures-util = "0.3"
url = "2"
dashmap = "6"
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
scraper = "0.19"
ego-tree = "0.6"
lru = "0.16.3"
fancy-regex = "0.16"
regex = "1"
lazy_static = "1.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
log = { version = "0.4", features = ["release_max_level_info"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "limits"] }
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
infer = "0.15"
tauri-plugin-log = "2.9.0"
tauri-plugin-vcp-mobile = { path = "./plugins/vcp-mobile" }
base64 = "0.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pdf_oxide = { version = "0.3.77", default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"
libc = "0.2"
percent-encoding = "2"
urlencoding = "2"
pulldown-cmark = { version = "0.13.3", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["html", "parsing", "regex-fancy", "default-syntaxes", "default-themes"] }
rustc-hash = "1.1.0"
memmap2 = "0.9.11"
zstd = "0.13"
tar = "0.4"
encoding_rs = "0.8"
chardetng = "0.1"
mime_guess = "2.0"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", default-features = false, features = ["test-util"] }
tauri = { workspace = true, features = ["test"] }

[[bench]]
name = "ast_tail_bench"
harness = false

[profile.release]
opt-level = 3   # 最高级别的代码优化
lto = true      # 启用链接时优化
codegen-units = 1   # 限制并行编译单元来提供更多的全局优化机会
panic = "abort" # 移除异常展开代码，减小体积
strip = true    # 移除符号信息，显著减小安装包大小

[profile.dev]
opt-level = 1   # 基础代码优化，保持极速编译的同时大幅缩减体积
debug = 0       # 彻底关闭开发模式下海量臃肿的调试符号（体积暴降的关键！）
strip = true    # 强行剥离动态库的辅助冗余符号

# 性能基准专用 profile：继承 release 的优化等级，但保留 panic=unwind 以便
# cargo test --profile perf 能正常链接测试 harness（release 的 panic=abort 无法运行测试）。
# 仅用于本地基准测量（如 ast_diff 的 tail 处理开销基准），不参与发布构建。
[profile.perf]
inherits = "release"
panic = "unwind"
strip = false
lto = "thin"        # full LTO 编译过慢；thin 已足够逼近发布版热路径性能
codegen-units = 16
