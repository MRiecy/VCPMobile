<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vcpmobile.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VCP Mobile</title>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
      /* 首帧占位底色：默认对齐「星渊雪境」亮色底盘；存储了暗色偏好的用户由下方内联脚本压暗 */
      body { background-color: #f4f6f8; }
      html.boot-dark body { background-color: #101014; }
      .preloader {
        display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
      }
      .preloader-brand { font-family: monospace; font-size: 11px; letter-spacing: 0.45em; font-weight: 900; color: #3b82f6; opacity: 0.8; margin-top: 32px; text-transform: uppercase;}
      .preloader-logo { width: 80px; height: 80px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(0.95); } }
    </style>
    <script>
      // 首帧底色对齐应用内主题偏好（在 body 绘制前同步执行）。
      // 不能用媒体查询猜：系统偏好代表不了用户的应用内选择——存了暗色偏好的用户
      // 在亮色系统上会看到「白色预载页 → 暗色主题接管」的黑帧闪烁。
      // boot-dark 的使命止于主题变量注入，由 theme.ts injectVariables 移除。
      (function () {
        try {
          var m = localStorage.getItem('vcp-theme-mode');
          if (m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('boot-dark');
          }
        } catch (e) { /* localStorage 不可用时保持亮色默认 */ }
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <div class="preloader">
        <div class="preloader-logo">
          <img src="/vcpmobile.svg" width="100%" height="100%" alt="VCP Mobile" />
        </div>
        <div class="preloader-brand">VCP MOBILE</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
