name: CI Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    name: Code Quality & Type Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Load pinned toolchain versions
        shell: bash
        run: cat .github/toolchain.env >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 peeled commit
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Vue & TypeScript Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Frontend Unit Tests
        run: pnpm test:run

      - name: Frontend Production Build
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: ''

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager "platforms;android-${ANDROID_COMPILE_SDK_VERSION}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action revision
        # toolchain/components 由仓库根 rust-toolchain.toml 提供（single source of truth）

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: "src-tauri"

      - name: Install Linux Dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Formatting Check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      - name: Rust Unit Tests
        working-directory: ./src-tauri
        run: cargo test --locked --workspace --lib

      - name: Rust Integration Tests
        run: pnpm test:integration

      - name: Initialize Android Tauri project
        run: pnpm tauri android init --ci

      - name: Generate Android Tauri module settings
        run: |
          pnpm ci:prepare-android-settings
          test -s src-tauri/gen/android/tauri.settings.gradle

      - name: Verify generated Android and plugin permission trees
        shell: bash
        run: |
          GENERATED_DRIFT=$(git status --porcelain --untracked-files=all -- \
            src-tauri/gen/android \
            src-tauri/plugins/vcp-mobile/permissions)
          if [[ -n "$GENERATED_DRIFT" ]]; then
            echo "Generated Android/plugin permission trees are dirty:" >&2
            printf '%s\n' "$GENERATED_DRIFT" >&2
            exit 1
          fi

      - name: Android Plugin Unit Tests
        working-directory: ./src-tauri/gen/android
        run: |
          chmod +x ./gradlew
          ./gradlew :tauri-plugin-vcp-mobile:testDebugUnitTest

      - name: Rust Clippy (Lint & Check)
        working-directory: ./src-tauri
        run: cargo clippy --locked --workspace --lib --tests -- -D warnings

      - name: Frontend dependency audit
        run: pnpm audit --audit-level=high
