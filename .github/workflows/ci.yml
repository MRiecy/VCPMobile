name: CI Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 建议使用 LTS 版本
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Vue & TypeScript Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Frontend Unit Tests
        run: pnpm test:run

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.13846066"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux Dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Formatting Check
        working-directory: ./src-tauri
        run: cargo fmt -- --check

      - name: Rust Unit Tests
        working-directory: ./src-tauri
        run: cargo test --lib

      - name: Rust Integration Tests
        working-directory: ./src-tauri
        run: cargo test --test file_extractor_integration

      - name: Initialize Android Project
        run: pnpm tauri android init --ci

      - name: Android Plugin Unit Tests
        working-directory: ./src-tauri/gen/android
        run: |
          chmod +x ./gradlew
          ./gradlew :tauri-plugin-vcp-mobile:testDebugUnitTest

      - name: Rust Benchmark Compile Check
        working-directory: ./src-tauri
        run: cargo bench --profile perf --no-run

      - name: Rust Clippy (Lint & Check)
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings
