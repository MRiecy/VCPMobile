name: CI Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 建议使用 LTS 版本
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Vue & TypeScript Type Check
        run: pnpm exec vue-tsc --noEmit

      - name: Frontend Unit Tests
        run: pnpm test:run

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux Dependencies (for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Formatting Check
        working-directory: ./src-tauri
        run: cargo fmt -- --check

      - name: Rust Unit Tests
        working-directory: ./src-tauri
        run: cargo test --lib

      - name: Rust Integration Tests
        working-directory: ./src-tauri
        run: cargo test --test file_extractor_integration

      - name: Generate tauri.settings.gradle
        working-directory: ./src-tauri
        shell: bash
        run: |
          set -e
          TAURI_CARGO_TOML=$(cargo metadata --format-version 1 | python3 -c "import sys,json; print(next(p['manifest_path'] for p in json.load(sys.stdin)['packages'] if p['name']=='tauri'))")
          TAURI_ANDROID_DIR=$(dirname "$TAURI_CARGO_TOML")/mobile/android
          OPENER_CARGO_TOML=$(cargo metadata --format-version 1 | python3 -c "import sys,json; print(next(p['manifest_path'] for p in json.load(sys.stdin)['packages'] if p['name']=='tauri-plugin-opener'))")
          OPENER_ANDROID_DIR=$(dirname "$OPENER_CARGO_TOML")/android
          PLUGIN_DIR="$GITHUB_WORKSPACE/src-tauri/plugins/vcp-mobile/android"
          OUT=gen/android/tauri.settings.gradle
          echo "// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY." > "$OUT"
          echo "include ':tauri-android'" >> "$OUT"
          echo "project(':tauri-android').projectDir = new File('$TAURI_ANDROID_DIR')" >> "$OUT"
          echo "include ':tauri-plugin-opener'" >> "$OUT"
          echo "project(':tauri-plugin-opener').projectDir = new File('$OPENER_ANDROID_DIR')" >> "$OUT"
          echo "include ':tauri-plugin-vcp-mobile'" >> "$OUT"
          echo "project(':tauri-plugin-vcp-mobile').projectDir = new File('$PLUGIN_DIR')" >> "$OUT"

      - name: Android Plugin Unit Tests
        working-directory: ./src-tauri/gen/android
        run: |
          chmod +x ./gradlew
          ./gradlew :tauri-plugin-vcp-mobile:testDebugUnitTest

      - name: Rust Benchmark Compile Check
        working-directory: ./src-tauri
        run: cargo bench --profile perf --no-run

      - name: Rust Clippy (Lint & Check)
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings
