name: Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

jobs:
  android-release:
    name: Build and Publish Android Release
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10'
      JAVA_VERSION: '17'
      NDK_VERSION: '29.0.13846066'
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/release.keystore

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tag commit, CI gate, and version sources
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG_NAME")
          if [[ -z "$TAG_COMMIT" || "$HEAD_COMMIT" != "$TAG_COMMIT" || "$HEAD_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Release checkout/tag/event commit mismatch: head=$HEAD_COMMIT tag=$TAG_COMMIT event=$GITHUB_SHA" >&2
            exit 1
          fi

          if [[ "$DEFAULT_BRANCH" != "main" && "$DEFAULT_BRANCH" != "master" ]]; then
            echo "Unsupported repository default branch for release: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$HEAD_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "Release commit $HEAD_COMMIT is not contained in origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

          CI_RUNS=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$HEAD_COMMIT" \
            --branch "$DEFAULT_BRANCH" \
            --event push \
            --limit 20 \
            --json conclusion,event,headBranch,headSha,url)
          if ! jq -e --arg sha "$HEAD_COMMIT" --arg branch "$DEFAULT_BRANCH" \
            'any(.[]; .headSha == $sha and .headBranch == $branch and .event == "push" and .conclusion == "success")' \
            <<< "$CI_RUNS" >/dev/null; then
            echo "No successful push CI run on $DEFAULT_BRANCH exists for release commit $HEAD_COMMIT" >&2
            echo "$CI_RUNS" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)

          for source_version in "$PACKAGE_VERSION" "$TAURI_VERSION" "$CARGO_VERSION"; do
            if [[ -z "$source_version" || "$source_version" != "$VERSION" ]]; then
              echo "Version mismatch for tag $TAG_NAME: package=$PACKAGE_VERSION tauri=$TAURI_VERSION cargo=$CARGO_VERSION" >&2
              exit 1
            fi
          done

          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION"
          if (( 10#$VERSION_MINOR > 999 || 10#$VERSION_PATCH > 999 )); then
            echo "Version minor/patch components must fit the Android versionCode layout: $VERSION" >&2
            exit 1
          fi
          EXPECTED_VERSION_CODE=$((10#$VERSION_MAJOR * 1000000 + 10#$VERSION_MINOR * 1000 + 10#$VERSION_PATCH))
          if (( EXPECTED_VERSION_CODE < 1 || EXPECTED_VERSION_CODE > 2100000000 )); then
            echo "Android versionCode is outside the valid positive 32-bit range: $EXPECTED_VERSION_CODE" >&2
            exit 1
          fi
          ANDROID_VERSION_CODE=$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")
          if [[ "$ANDROID_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "Android versionCode mismatch: expected=$EXPECTED_VERSION_CODE actual=$ANDROID_VERSION_CODE" >&2
            exit 1
          fi

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${EXPECTED_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "commit=${HEAD_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 peeled commit
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 peeled commit
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Gradle wrapper JAR
        run: |
          printf '%s  %s\n' '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172' 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Restore Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for required_secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required_secret:-}" ]]; then
              echo "Required release secret is missing: $required_secret" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          test -s "${ANDROID_KEYSTORE_PATH}"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null

      - name: Build Android APKs
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VCP_TRUSTED_LAN_MODE: enabled
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps >/dev/null
          # verification-metadata.xml enables Gradle's strict dependency verification by default.
          test -s src-tauri/gen/android/gradle/verification-metadata.xml
          pnpm tauri android build --apk --target aarch64
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock

      - name: Verify APK signature
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK_SIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          if [[ ! -x "$APK_SIGNER" || ! -x "$AAPT" ]]; then
            echo "apksigner/aapt not found in Android build-tools" >&2
            exit 1
          fi

          mapfile -t RELEASE_APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" -type f | sort)
          if [[ "${#RELEASE_APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#RELEASE_APKS[@]}" >&2
            find src-tauri/gen/android/app/build/outputs -name "*.apk" -type f || true
            exit 1
          fi
          SOURCE_APK="${RELEASE_APKS[0]}"

          echo "APK path: $SOURCE_APK"

          echo "=== apksigner verify ==="
          CERT_OUTPUT=$("$APK_SIGNER" verify --verbose --print-certs "$SOURCE_APK")
          printf '%s\n' "$CERT_OUTPUT"

          mapfile -t APK_CERTS < <(awk -F': ' '/certificate SHA-256 digest:/ {print $2}' <<< "$CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
          KEYSTORE_OUTPUT=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD)
          mapfile -t KEYSTORE_CERTS < <(awk -F': ' '/SHA256:/ {print $2}' <<< "$KEYSTORE_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
          EXPECTED_CERT=$(tr -d '[:space:]:' <<< "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]')

          if [[ "${#APK_CERTS[@]}" -ne 1 || ! "${APK_CERTS[0]:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "APK certificate SHA-256 extraction failed or returned multiple identities" >&2
            exit 1
          fi
          if [[ "${#KEYSTORE_CERTS[@]}" -ne 1 || ! "${KEYSTORE_CERTS[0]:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Keystore certificate SHA-256 extraction failed or returned multiple identities" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Repository variable ANDROID_RELEASE_CERT_SHA256 is missing or invalid" >&2
            exit 1
          fi

          echo "=== Fingerprint Comparison ==="
          echo "APK:      ${APK_CERTS[0]}"
          echo "Keystore: ${KEYSTORE_CERTS[0]}"
          echo "Expected: $EXPECTED_CERT"

          if [[ "${APK_CERTS[0]}" != "${KEYSTORE_CERTS[0]}" || "${APK_CERTS[0]}" != "$EXPECTED_CERT" ]]; then
            echo "ERROR: APK, keystore, and pinned release certificate identities do not match" >&2
            exit 1
          fi

          if grep -qi "Android Debug" <<< "$CERT_OUTPUT"; then
            echo "ERROR: APK is signed with Android Debug key!" >&2
            exit 1
          fi

          BADGING=$("$AAPT" dump badging "$SOURCE_APK")
          APK_PACKAGE=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")
          APK_VERSION_CODE=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")
          APK_VERSION=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          if [[ "$APK_PACKAGE" != "com.vcp.avatar" || "$APK_VERSION" != "$EXPECTED_VERSION" || "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "APK metadata mismatch: package=$APK_PACKAGE version=$APK_VERSION code=$APK_VERSION_CODE" >&2
            exit 1
          fi
          APK_ENTRIES=$(unzip -Z1 "$SOURCE_APK")
          if ! grep -Eq '^lib/arm64-v8a/.*\.so$' <<< "$APK_ENTRIES"; then
            echo "APK does not contain arm64-v8a native libraries" >&2
            exit 1
          fi
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$APK_ENTRIES"; then
            echo "APK contains a forbidden non-arm64 ABI" >&2
            exit 1
          fi
          if ! grep -q '^lib/arm64-v8a/libvcp_pty\.so$' <<< "$APK_ENTRIES"; then
            echo "APK does not contain the manual PTY native helper" >&2
            exit 1
          fi
          if grep -Eq 'vcp-semantic-(tokenizer|model)' <<< "$APK_ENTRIES"; then
            echo "APK contains retired local semantic model assets" >&2
            exit 1
          fi

          echo "SOURCE_APK=$SOURCE_APK" >> "$GITHUB_ENV"

      - name: Remove Android keystore
        if: always()
        shell: bash
        run: |
          expected_keystore="$GITHUB_WORKSPACE/src-tauri/release.keystore"
          if [[ "$ANDROID_KEYSTORE_PATH" != "$expected_keystore" ]]; then
            echo "Refusing to remove unexpected keystore path: $ANDROID_KEYSTORE_PATH" >&2
            exit 1
          fi
          rm -f -- "$ANDROID_KEYSTORE_PATH"

      - name: Collect and rename APK artifact
        id: artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts

          source_apk="${{ env.SOURCE_APK }}"
          if [[ -z "$source_apk" || ! -f "$source_apk" ]]; then
            echo "SOURCE_APK not set or file missing" >&2
            exit 1
          fi

          target_apk="release-artifacts/VCPMobile_v${{ steps.meta.outputs.version }}_arm64-v8a.apk"
          cp "$source_apk" "$target_apk"
          target_name=$(basename "$target_apk")
          target_sha256=$(sha256sum "$target_apk" | awk '{print $1}')
          printf '%s  %s\n' "$target_sha256" "$target_name" > "${target_apk}.sha256"

          echo "artifact_dir=release-artifacts" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          append_body: true
          files: |
            ${{ steps.artifacts.outputs.artifact_dir }}/*.apk
            ${{ steps.artifacts.outputs.artifact_dir }}/*.sha256
