name: iOS stage diagnostics
run-name: iOS ${{ inputs.phase }} / ${{ inputs.profile }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Stage being diagnosed (labels evidence; does not mark acceptance)
        type: choice
        default: phase-3
        options: [phase-0, phase-1, phase-2, phase-3, phase-4, phase-5, phase-6]
      profile:
        description: Device archive build profile
        type: choice
        default: debug
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: ios-diagnostics-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  device-archive:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      IOS_DIAGNOSTIC_PHASE: ${{ inputs.phase }}
      IOS_DIAGNOSTIC_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Checkout selected revision
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Prepare diagnostic evidence
        id: prepare
        run: python3 src-tauri/ios/scripts/g1.py prepare
      - name: Set up Python for the pinned voice build dependencies
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Load pinned toolchain versions
        id: versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/toolchain.env >> "$GITHUB_ENV"
      - name: Set up Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install locked frontend dependencies
        id: dependencies
        run: |
          set -o pipefail
          npm install --global "pnpm@${PNPM_VERSION}" 2>&1 | tee "$RUNNER_TEMP/vcp-ios-g1/pnpm-setup.log"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/vcp-ios-g1/dependencies.log"
      - name: Build unsigned device archive and collect diagnostics
        id: build
        timeout-minutes: 75
        run: python3 src-tauri/ios/scripts/g1.py build
      - name: Summarize diagnostic outcome
        if: always() && steps.checkout.outcome == 'success'
        env:
          IOS_DIAGNOSTIC_STEPS: ${{ toJSON(steps) }}
        run: python3 src-tauri/ios/scripts/g1.py summary
      - name: Preserve stage diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-${{ inputs.phase }}-${{ inputs.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vcp-ios-g1/*.json
            ${{ runner.temp }}/vcp-ios-g1/*.log
            ${{ runner.temp }}/vcp-ios-g1/*.txt
            ${{ runner.temp }}/vcp-ios-g1/*.md
            ${{ runner.temp }}/vcp-ios-g1/*.zip
            ${{ runner.temp }}/vcp-ios-g1/generated-project/**
            ${{ runner.temp }}/vcp-ios-g1/bundles/**
          if-no-files-found: warn
          retention-days: 14
