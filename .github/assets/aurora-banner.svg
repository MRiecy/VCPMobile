<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AURORA — The Incremental Streaming Renderer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1e"/>
      <stop offset="0.55" stop-color="#10163a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="bandTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d946ef" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.35 0; 0.35 0; -0.35 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="blur22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur34" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- 星野 -->
  <g fill="#e2e8f0">
    <circle cx="80" cy="46" r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="90" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="34" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="70" r="1.0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="30" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="62" r="1.0"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="28" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="58" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="34" r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="76" r="1.0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="44" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="96" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1.0"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="5.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="140" r="1.2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="0.9"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="105" r="0.9"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 极光 -->
  <g filter="url(#blur34)">
    <g transform="rotate(-7 340 110)">
      <ellipse cx="340" cy="110" rx="390" ry="42" fill="url(#bandTeal)" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 70 12; 0 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <g filter="url(#blur22)">
    <g transform="rotate(6 850 92)">
      <ellipse cx="850" cy="92" rx="430" ry="36" fill="url(#bandViolet)" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 16; 0 0" dur="19s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <g filter="url(#blur34)">
    <g transform="rotate(-3 600 152)">
      <ellipse cx="600" cy="152" rx="540" ry="28" fill="url(#bandPink)" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0; 50 -10; 0 0" dur="23s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 流星 -->
  <g opacity="0">
    <line x1="-46" y1="-17" x2="0" y2="0" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round"/>
    <animateMotion path="M1080,36 L700,170" dur="9s" begin="2.5s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.7;0.78;0.9;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
  </g>

  <!-- 山峦 -->
  <path d="M0,300 L0,252 L130,208 L270,256 L430,204 L580,258 L770,214 L930,260 L1090,222 L1200,254 L1200,300 Z" fill="#0a0f2a" opacity="0.95"/>
  <path d="M0,300 L0,272 L180,240 L360,276 L540,238 L730,278 L900,244 L1060,274 L1200,248 L1200,300 Z" fill="#070b20"/>

  <!-- 题名 -->
  <text x="600" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="62" letter-spacing="16" fill="url(#titleGrad)">AURORA</text>
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="8" fill="#cbd5e1">完全增量流式渲染引擎</text>
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" letter-spacing="3" fill="#7c8aa5">The Incremental Streaming Renderer</text>
</svg>
